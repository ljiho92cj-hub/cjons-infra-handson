apiVersion: v1
kind: Namespace
metadata:
  name: cj-lab-ai
---
apiVersion: v1
kind: Pod
metadata:
  name: ai-demo-crashloop
  namespace: cj-lab-ai
  labels:
    demo: ai-evidence
spec:
  containers:
    - name: app
      image: busybox:1.36.1
      imagePullPolicy: Never
      command: ["/bin/sh", "-c"]
      args: ["echo 'ERROR config file /config/app.yaml not found'; exit 1"]
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: ai-demo-pending
  namespace: cj-lab-ai
  labels:
    demo: ai-evidence
spec:
  containers:
    - name: app
      image: busybox:1.36.1
      imagePullPolicy: Never
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "100"
          memory: 1Gi
