# HPA 전제조건: metrics-server가 클러스터에 떠 있어야 한다 (kubectl top pod로 사전 확인).
# averageUtilization: 20 은 "web-hpa 컨테이너 CPU requests(50m)의 20%"가 스케일 기준이라는 뜻.
# requests를 바꾸면 이 target의 실제 절대값도 같이 바뀐다 (requests 50m -> 기준 10m).
#
# behavior.scaleDown.stabilizationWindowSeconds: 스케일다운 전에 최근 값들 중 "가장 큰" replica
# 요구치를 이 시간 창(초) 동안 유지한다. 값이 낮을수록 반응이 빠르지만 진동(flapping) 위험이 커진다.
# initialization-period와 downscale-stabilization이 HPA 반응에 영향을 주는 지점이다.
#
# 이 값은 «실습용 30»이다. 쿠버네티스 기본값은 300초이고 운영에서는 60~300초를 흔히 쓴다.
# 30으로 낮춘 이유는 하나뿐이다 — 강의 중에 scale-in을 «눈으로 볼 수 있게» 하기 위함이다.
#   30 : 부하 제거 후 약 1분 안팎에 REPLICAS가 줄어든다(관찰 가능)
#   60 : 약 2분. 강의 시간 안에서는 끝까지 지켜보기 어렵다
#  300 : 5분 이상. 강의 시간 안에는 관찰 불가
# 운영에 그대로 가져가지 말 것. 짧을수록 부하가 출렁일 때 replica가 따라 출렁인다(flapping).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: cj-lab-resources
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-hpa
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleDown:
      # 실습 관찰용 30초. 운영 기본값은 300초 — 위 주석 참조.
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 20
